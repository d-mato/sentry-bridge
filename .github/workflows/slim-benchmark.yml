name: slim-benchmark

on:
  push:
    branches: [claude/ubuntu-slim-runner-migration-ot9qo9]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-slim]
    runs-on: ${{ matrix.runner }}
    steps:
      - run: 'nproc; free -m; df -h /; cat /etc/os-release | head -2'

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec biome ci

      - run: pnpm typecheck

      - run: pnpm test
